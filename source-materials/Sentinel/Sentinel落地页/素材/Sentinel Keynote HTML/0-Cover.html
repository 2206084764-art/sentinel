<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#050810;--green:#2AF598;--blue:#009EFD;
  --white:#fff;--grey:#A0AEC0;--grey-dim:rgba(160,174,192,.5);
  --epic:cubic-bezier(.22,1,.36,1);--apple:cubic-bezier(.16,1,.3,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:var(--font);color:var(--white);user-select:none;}
#canvas{position:relative;background:var(--bg-deep);aspect-ratio:16/9;width:100%;max-height:100vh;max-width:177.77vh;container-type:size;container-name:slide;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.8);}
#canvas::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:4cqh 4cqh;}
.fx-scan{position:absolute;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);opacity:.5;}
.fx-vig{position:absolute;inset:0;z-index:41;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.85) 100%);}

/* background hero truck */
.bg{position:absolute;inset:0;z-index:0;background:url('Images/hero-truck.jpg') center/cover no-repeat;opacity:0;transform:scale(1.08);transition:opacity 2.4s ease,transform 6s var(--apple);}
#canvas[data-step] .bg{opacity:.55;transform:scale(1);}
.bg-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(to right,rgba(5,8,16,.94) 22%,rgba(5,8,16,.55) 55%,rgba(5,8,16,.25) 100%),linear-gradient(to top,rgba(5,8,16,.95) 8%,transparent 45%);}

.brand{position:absolute;top:3cqh;right:5cqh;z-index:30;height:3.4cqh;display:flex;align-items:center;}
.brand img{height:100%;filter:brightness(0) invert(1);opacity:.55;}
.hdr{position:absolute;top:0;left:0;width:100%;height:7.5cqh;display:flex;justify-content:center;align-items:center;z-index:46;}
.hdr .lbl{font-size:1.35cqh;letter-spacing:3px;font-weight:700;color:var(--green);padding-bottom:.5cqh;border-bottom:1px solid rgba(42,245,152,.3);text-shadow:0 0 10px rgba(42,245,152,.35);}

/* content */
.hero{position:absolute;left:8cqh;bottom:16cqh;z-index:10;max-width:110cqh;}
.kicker{font-size:1.7cqh;letter-spacing:.45em;text-transform:uppercase;font-weight:700;color:var(--grey);margin-bottom:2.4cqh;opacity:0;transform:translateY(18px);transition:all .9s var(--apple) .5s;}
.kicker b{color:var(--green);text-shadow:0 0 12px rgba(42,245,152,.4);}
.title{font-size:16cqh;font-weight:900;line-height:.92;letter-spacing:-.35cqh;background:linear-gradient(135deg,var(--green) 15%,var(--blue) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 4cqh rgba(42,245,152,.18));opacity:0;transform:translateY(26px);transition:all 1.1s var(--apple) .8s;}
.subtitle{font-size:3.6cqh;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;margin-top:1.8cqh;opacity:0;transform:translateY(20px);transition:all 1s var(--apple) 1.15s;}
.slogan{font-size:2.3cqh;font-weight:400;color:var(--grey);margin-top:1.6cqh;letter-spacing:.3px;opacity:0;transform:translateY(16px);transition:all 1s var(--apple) 1.4s;}
#canvas[data-step] .kicker,#canvas[data-step] .title,#canvas[data-step] .subtitle,#canvas[data-step] .slogan{opacity:1;transform:translateY(0);}

/* meta chips bottom-right */
.meta{position:absolute;right:8cqh;bottom:16.5cqh;z-index:10;display:flex;flex-direction:column;gap:1.4cqh;align-items:flex-end;opacity:0;transform:translateY(16px);transition:all 1s var(--apple) 1.7s;}
#canvas[data-step] .meta{opacity:1;transform:translateY(0);}
.chip{display:flex;align-items:center;gap:1.2cqh;padding:1.2cqh 2cqh;border-radius:30px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);backdrop-filter:blur(10px);font-size:1.5cqh;font-weight:600;color:rgba(255,255,255,.85);letter-spacing:.5px;}
.chip .dot{width:.9cqh;height:.9cqh;border-radius:50%;background:var(--green);box-shadow:0 0 1.2cqh rgba(42,245,152,.7);}
.chip.rec .dot{background:#FF3B30;box-shadow:0 0 1.2cqh rgba(255,59,48,.7);animation:blink 1.6s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.footline{position:absolute;bottom:3cqh;left:8cqh;z-index:10;font-size:1.15cqh;letter-spacing:2px;color:var(--grey-dim);opacity:0;transition:opacity 1.2s ease 2.1s;}
#canvas[data-step] .footline{opacity:1;}
.hint{position:absolute;bottom:2.2cqh;right:4cqh;font-size:1cqh;color:rgba(255,255,255,.25);z-index:50;}
</style>
</head>
<body>
<div id="canvas" data-step="0">
  <div class="bg"></div>
  <div class="bg-scrim"></div>
  <div class="hdr"><div class="lbl">— STREAMAX PRODUCT LAUNCH · 2026 —</div></div>
  <div class="brand"><img src="Branding/streamax.png" alt="Streamax" onerror="this.style.display='none'"></div>

  <div class="hero">
    <div class="kicker">Trucking · <b>Asset Security</b> Solution</div>
    <h1 class="title">Sentinel</h1>
    <div class="subtitle">The 24/7 Always-on Video Camera</div>
    <div class="slogan">Safeguard your assets with confidence — even when the engine is off.</div>
  </div>

  <div class="meta">
    <div class="chip rec"><span class="dot"></span>ALWAYS RECORDING</div>
    <div class="chip"><span class="dot"></span>UP TO 90-DAY STANDBY</div>
  </div>

  <div class="footline">STREAMAX · SENTINEL RELEASE KEYNOTE · CONFIDENTIAL</div>
  <div class="hint">← / → · arrow keys</div>
  <div class="fx-scan"></div>
  <div class="fx-vig"></div>
</div>
<script>
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>document.getElementById('canvas').setAttribute('data-step','1'),250);});
/* unified deck navigation: any click advances to the next slide */
function navNext(){ try{parent.postMessage({type:'deck-next'},'*');}catch(_){} }
function navPrev(){ try{parent.postMessage({type:'deck-prev'},'*');}catch(_){} }
/* deck advances by ← / → only — click does not navigate */
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();navNext();}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();navPrev();}
});
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.type==='deck-nav'){ d.dir==='prev'?navPrev():navNext(); } });
</script>
</body>
</html>
