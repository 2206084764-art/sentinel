<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Keynote — Player</title>
<style>
:root{--green:#2AF598;--blue:#009EFD;--bg:#050810;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;display:block;}

/* edge nav (switch FILES) — center stays interactive for each deck's own steps */
.edge{position:fixed;top:0;height:100%;width:7%;z-index:20;display:none;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .25s ease;background:linear-gradient(var(--dir),rgba(0,0,0,.45),transparent);}
.edge.left{left:0;--dir:90deg;} .edge.right{right:0;--dir:270deg;}
.edge:hover{opacity:1;}
.edge svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(0,0,0,.6));}

/* top HUD (auto-hide) */
.hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;padding:7px 16px;border-radius:30px;background:rgba(8,12,20,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:13px;opacity:0;transition:opacity .3s ease;pointer-events:none;}
.hud.show{opacity:1;pointer-events:auto;}
.hud .count{font-weight:800;letter-spacing:.5px;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hud .name{color:rgba(255,255,255,.7);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud button{all:unset;cursor:pointer;color:rgba(255,255,255,.85);font-size:14px;padding:2px 8px;border-radius:6px;}
.hud button:hover{background:rgba(255,255,255,.12);}

/* list overlay */
.list{position:fixed;inset:0;z-index:40;background:rgba(4,7,13,.92);backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6vh 8vw;}
.list.show{display:flex;}
.list h2{color:#fff;font-size:15px;letter-spacing:3px;font-weight:700;margin-bottom:14px;opacity:.6;}
.list .item{width:min(620px,90vw);display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);color:#cbd5e1;font-size:14px;cursor:pointer;transition:all .15s ease;}
.list .item:hover{background:rgba(255,255,255,.07);border-color:rgba(42,245,152,.4);}
.list .item.cur{border-color:var(--green);color:#fff;}
.list .item .n{font-weight:800;font-family:ui-monospace,monospace;color:var(--green);min-width:26px;}
.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:30;color:rgba(255,255,255,.28);font-size:11px;letter-spacing:.5px;}
</style>
</head>
<body>
<iframe id="stage" allow="autoplay; fullscreen"></iframe>

<div class="edge left"  id="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
<div class="edge right" id="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>

<div class="hud" id="hud">
  <button id="hprev">◀</button>
  <span class="count" id="count">1 / 1</span>
  <span class="name" id="name"></span>
  <button id="hnext">▶</button>
  <button id="hlist">☰</button>
</div>

<div class="list" id="listOverlay"><h2>JUMP TO</h2></div>
<div class="hint">→ = next · ← = back · L = list · F = fullscreen</div>

<script>
/* Ordered by leading number. Regenerate if files change. */
const FILES=[
  "0-Cover.html",
  "1-PainPoints.html",
  "2-TheGap.html",
  "4-Sentinel.html",
  "5-AOV.html",
  "6-IntentAI.html",
  "7-BlackLightUltra.html",
  "8-AllInOne.html",
  "9-IoTSynergies.html",
  "10-EasyInstall.html",
  "11-Summary.html",
  "12-GlobalCases.html",
  "13-ReleasePlan.html"
];

const stage=document.getElementById('stage');
const count=document.getElementById('count');
const name=document.getElementById('name');
const hud=document.getElementById('hud');
const listOverlay=document.getElementById('listOverlay');
let i=0;

function load(n){
  i=Math.max(0,Math.min(FILES.length-1,n));
  stage.src=encodeURI(FILES[i]);
  count.textContent=(i+1)+" / "+FILES.length;
  name.textContent=FILES[i];
  buildList();
  flashHud();
}
function nextF(){if(i<FILES.length-1)load(i+1);}
function prevF(){if(i>0)load(i-1);}

function sendNav(dir){ try{ stage.contentWindow.postMessage({type:'deck-nav',dir:dir},'*'); }catch(_){ dir==='next'?nextF():prevF(); } }
window.addEventListener('message',e=>{ const d=e.data||{};
  if(d.type==='deck-next') nextF();
  else if(d.type==='deck-prev') prevF();
});
/* edge click-nav removed — deck moves with ← / → only */
document.getElementById('hnext').onclick=nextF;
document.getElementById('hprev').onclick=prevF;
document.getElementById('hlist').onclick=()=>listOverlay.classList.toggle('show');

function buildList(){
  listOverlay.querySelectorAll('.item').forEach(e=>e.remove());
  FILES.forEach((f,idx)=>{
    const d=document.createElement('div');
    d.className='item'+(idx===i?' cur':'');
    const num=(f.match(/^\d+/)||[''])[0];
    d.innerHTML='<span class="n">'+num+'</span>'+f.replace(/^\d+-/,'').replace(/\.html$/,'');
    d.onclick=()=>{load(idx);listOverlay.classList.remove('show');};
    listOverlay.appendChild(d);
  });
}

let hudTimer;
function flashHud(){hud.classList.add('show');clearTimeout(hudTimer);hudTimer=setTimeout(()=>hud.classList.remove('show'),2200);}
document.addEventListener('mousemove',flashHud);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();sendNav('next');}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();sendNav('prev');}
  else if(e.key.toLowerCase()==='r'){try{stage.contentWindow.postMessage({type:'deck-key',key:'r'},'*');}catch(_){}}
  else if(e.key.toLowerCase()==='t'){try{stage.contentWindow.postMessage({type:'deck-key',key:'t'},'*');}catch(_){}}
  else if(e.key.toLowerCase()==='s'){try{stage.contentWindow.postMessage({type:'deck-key',key:'s'},'*');}catch(_){}}
  else if(e.key.toLowerCase()==='l'){listOverlay.classList.toggle('show');}
  else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(e.key==='Escape'){listOverlay.classList.remove('show');}
});

load(0);
</script>
</body>
</html>
