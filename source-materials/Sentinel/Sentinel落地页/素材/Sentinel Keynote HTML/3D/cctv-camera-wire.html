/* ---------- Load the OBJ-derived GLB (embedded, textured lens) ---------- */
const device=new THREE.Group(); scene.add(device);
let loaded=false, tintMats=[];
new GLTFLoader().load(CCTV_GLB_URL,(gltf)=>{
  const root=gltf.scene;
  root.traverse(o=>{ if(o.isMesh){
    o.castShadow=o.receiveShadow=true;
    if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals();   // model had no normals
    const m=o.material;
    if(m){ m.metalness=Math.min(0.4, m.metalness??0.2); m.roughness=THREE.MathUtils.clamp(m.roughness??0.5,0.3,0.7);
           m.envMapIntensity=1.2; if(m.map) m.map.colorSpace=THREE.SRGBColorSpace; tintMats.push(m); }
  }});
  // upright, centre, float at the orbit target
  const bb=new THREE.Box3().setFromObject(root), size=bb.getSize(new THREE.Vector3()), ctr=bb.getCenter(new THREE.Vector3());
  const s=4.6/Math.max(size.x,size.y,size.z);
  root.scale.setScalar(s);
  root.position.set(-ctr.x*s, 2.4-ctr.y*s, -ctr.z*s);
  device.add(root);
  loaded=true;
  document.getElementById('loading').style.display='none';
  applyEmbed();
},undefined,(err)=>{ document.getElementById('loading').textContent='Could not parse the embedded model.'; });

/* ---------- Ground: reflector + contact shadow ---------- */
const FY=0.0;
const mirror=new Reflector(new THREE.PlaneGeometry(70,70),{ clipBias:0.003,
  textureWidth:innerWidth*Math.min(devicePixelRatio,2), textureHeight:innerHeight*Math.min(devicePixelRatio,2), color:0x2a2e33 });
mirror.rotation.x=-Math.PI/2; mirror.position.y=FY; scene.add(mirror);

shadowCatcher.rotation.x=-Math.PI/2; shadowCatcher.position.y=FY+0.003; shadowCatcher.receiveShadow=true; scene.add(shadowCatcher);

/* ---------- Particle mode ---------- */
const _a=new THREE.Vector3(),_b=new THREE.Vector3(),_c=new THREE.Vector3(),_ab=new THREE.Vector3(),_ac=new THREE.Vector3();
function area(geo){ const p=geo.attributes.position; if(!p) return 0; let A=0; const idx=geo.index;
  const tri=(i,j,k)=>{ _a.fromBufferAttribute(p,i);_b.fromBufferAttribute(p,j);_c.fromBufferAttribute(p,k);
    _ab.subVectors(_b,_a);_ac.subVectors(_c,_a); A+=_ab.cross(_ac).length()*0.5; };
  if(idx){ for(let i=0;i<idx.count;i+=3) tri(idx.getX(i),idx.getX(i+1),idx.getX(i+2)); }
  else{ for(let i=0;i<p.count;i+=3) tri(i,i+1,i+2); } return A; }
let particleCloud=null;
function buildParticles(){
  scene.updateMatrixWorld(true);
  const items=[]; let tot=0; const tp=new THREE.Vector3(),tq=new THREE.Quaternion(),ts=new THREE.Vector3();
  device.traverse(o=>{ if(!o.isMesh||!o.geometry||!o.geometry.attributes.position) return;
    o.matrixWorld.decompose(tp,tq,ts); const sa=(Math.abs(ts.x)+Math.abs(ts.y)+Math.abs(ts.z))/3;
    const A=area(o.geometry)*sa*sa; if(A>0){ items.push({o,A}); tot+=A; } });
  const TARGET=120000, pos=[], col=[]; const p=new THREE.Vector3(), C=new THREE.Color(), blue=new THREE.Color(0x8fd0ff), white=new THREE.Color(0xffffff);
  for(const {o,A} of items){ let n=Math.max(6,Math.round(TARGET*A/tot));
    let smp; try{ smp=new MeshSurfaceSampler(o).build(); }catch(e){ continue; }
    for(let i=0;i<n;i++){ smp.sample(p); p.applyMatrix4(o.matrixWorld);
      C.copy(blue).lerp(white, Math.random()*0.6);
      pos.push(p.x,p.y,p.z); col.push(C.r,C.g,C.b); } }
  const bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  bg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  particleCloud=new THREE.Points(bg,new THREE.PointsMaterial({ size:parseFloat(psizeEl.value), vertexColors:true, sizeAttenuation:true, transparent:true, opacity:0.95, depthWrite:true }));
  scene.add(particleCloud);
}

/* ---------- Modes / UI (deck-style clean blue wireframe) ---------- */
const modeEl=document.getElementById('mode'), psizeEl=document.getElementById('psize'),
      pcountEl=document.getElementById('pcount');
const wireMat=new THREE.LineBasicMaterial({ color:0xffffff });
const ghostMat=new THREE.MeshBasicMaterial({ color:0xffffff, wireframe:true, transparent:true, opacity:0.07 });
function clearWire(){ device.traverse(o=>{ if(o.isMesh && o.userData._mat){ o.material=o.userData._mat; o.userData._mat=null; if(o.userData._edges) o.userData._edges.visible=false; } }); }
function applyWire(){ device.traverse(o=>{ if(o.isMesh && !o.userData._mat && !o.userData._isEdge){ o.userData._mat=o.material; o.material=ghostMat;
  if(!o.userData._edges){ const e=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,14), wireMat); e.userData._isEdge=true; o.add(e); o.userData._edges=e; }
  o.userData._edges.visible=true; } }); }
function setMode(mode){
  if(!loaded){ return; }
  clearWire(); device.visible=true; if(particleCloud) particleCloud.visible=false;
  scene.background=null; groundEls.forEach(e=> e.visible=false); pcountEl.textContent='';
  if(mode==='wireframe'){ applyWire(); }
  else if(mode==='particles'){ if(!particleCloud){ pcountEl.textContent='sampling…'; buildParticles(); }
    particleCloud.visible=true; device.visible=false;
    pcountEl.textContent=particleCloud.geometry.attributes.position.count.toLocaleString()+' particles'; }
}
modeEl.onchange=()=>setMode(modeEl.value);
psizeEl.oninput=()=>{ if(particleCloud) particleCloud.material.size=parseFloat(psizeEl.value); };

/* embed overrides: url-configurable mode/fit/zoom/spin, auto-rotate, no interaction. Runs after the model loads. */
function applyEmbed(){
  const __q=new URLSearchParams(location.search);
  scene.updateMatrixWorld(true);
  const __fit=__q.get('fit');
  if(__fit!==null){
    const bb=new THREE.Box3().setFromObject(device);
    const c=bb.getCenter(new THREE.Vector3());
    controls.target.copy(c);
    const dy=parseFloat(__q.get('dy')||'0');
    controls.target.y+=dy*(bb.max.y-bb.min.y);
    const vHalf=camera.fov*Math.PI/360, hHalf=Math.atan(Math.tan(vHalf)*camera.aspect);
    const tanV=Math.tan(vHalf), tanH=Math.tan(hHalf);
    let need=0; const v=new THREE.Vector3();
    device.traverse(o=>{ if(o.isMesh&&o.geometry){
      if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
      const b=o.geometry.boundingBox;
      for(let i=0;i<8;i++){
        v.set(i&1?b.max.x:b.min.x, i&2?b.max.y:b.min.y, i&4?b.max.z:b.min.z).applyMatrix4(o.matrixWorld);
        const rxz=Math.hypot(v.x-c.x, v.z-c.z);
        const dv=rxz+Math.abs(v.y-controls.target.y)/tanV, dh=rxz+rxz/tanH;
        if(dv>need)need=dv; if(dh>need)need=dh;
      }
    }});
