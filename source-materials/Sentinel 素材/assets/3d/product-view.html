<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel interactive product model</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;touch-action:pan-y}</style>
<script src="../js/frame-lifecycle.js"></script>
<script type="importmap">{"imports":{"three":"../js/vendor/three/build/three.module.js","three/addons/":"../js/vendor/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const renderer = new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const environment=pmrem.fromScene(new RoomEnvironment(),.04);scene.environment=environment.texture;
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);
camera.position.set(4,2.7,7);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.enablePan=false;controls.enableZoom=false;
controls.autoRotate=true;controls.autoRotateSpeed=.65;
scene.add(new THREE.HemisphereLight(0xffffff,0x242a12,2));
const key=new THREE.DirectionalLight(0xffffff,2.7);key.position.set(2,4,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xc4e63c,3);rim.position.set(-4,2,-3);scene.add(rim);
let model,progress=0;
const basePosition=new THREE.Vector3(4,2.7,7);
new GLTFLoader().load('models/model-bffe2948bc9e.glb', ({scene:root})=>{
  const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  const scale=4/Math.max(size.x,size.y,size.z);root.scale.setScalar(scale);root.position.copy(center).multiplyScalar(-scale);root.updateMatrixWorld(true);
  root.traverse(mesh=>{
    if(!mesh.isMesh)return;
    const part=new THREE.Box3().setFromObject(mesh).getSize(new THREE.Vector3());
    if(Math.max(part.x,part.y,part.z)<.4){mesh.visible=false;return;}
    mesh.material=new THREE.MeshStandardMaterial({color:0x252c28,metalness:.36,roughness:.48,envMapIntensity:.85});
  });
  model=new THREE.Group();model.add(root);model.rotation.x=.12;scene.add(model);
  renderer.render(scene,camera);
  parent.postMessage({channel:'sentinel',type:'scene-ready',scene:'product-view'},location.origin);
},undefined,()=>parent.postMessage({channel:'sentinel',type:'scene-error'},location.origin));
window.SENTINEL_FRAME_API={
  getState(){return {camera:camera.position.toArray(),rotation:camera.quaternion.toArray(),modelReady:!!model}},
  command(data){
    if(data.action==='progress')progress=data.value;
    if(data.action==='zoom'){camera.position.copy(basePosition).multiplyScalar(data.value? .7:1);controls.update()}
    if(data.action==='view'){
      controls.autoRotate=false;
      camera.position.copy(data.value==='rear'?new THREE.Vector3(-4,2,-7):basePosition);controls.update();
    }
    if(data.action==='interactive'){controls.autoRotate=!data.value;controls.enabled=true}
    if(data.action==='pointer'&&!controls.state){rim.intensity=3+Math.abs(data.x)*.6}
  },
  dispose(){scene.traverse(o=>{o.geometry?.dispose();if(o.material){for(const m of [].concat(o.material))m.dispose()}});environment.dispose();pmrem.dispose();controls.dispose();renderer.dispose();renderer.forceContextLoss()}
};
function frame(){requestAnimationFrame(frame);if(model)model.position.y=Math.sin(performance.now()*.00065)*.045-progress*.12;controls.update();renderer.render(scene,camera)}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
